<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- This file is the manifest: it names the ?v= build of every script below.
       If it gets cached, the browser keeps asking for the OLD asset URLs and the
       user runs a build that no longer exists — which looks exactly like "my fix
       did nothing". Always revalidate it. -->
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
  <title>PhD Navigator — know the path ahead</title>
  <script>
    /* Backend origin for auth + chat.
     *
     * The API is NOT on the same host as this static frontend, so it has to be
     * named explicitly. Every environment starts on the deployed Render API;
     * running `uvicorn` locally is what opts you out of it:
     *
     *   any origin            -> the deployed Render API (always reachable)
     *   localhost / 127.0.0.1 -> switches to <host>:8000 IF a local backend answers
     *
     * localStorage['phd-api-base'] still overrides both, which is handy for
     * pointing a deployed UI at a tunnel during a demo.
     */
    (function () {
      var h = location.hostname;
      var isLocal = h === "localhost" || h === "127.0.0.1" || h === "";
      var RENDER_API = "https://phd-navigator-api.onrender.com";

      // Default to the deployed API EVERYWHERE, including localhost.
      //
      // This used to be the other way round: local dev started with an empty
      // base (so requests went to <host>:8000) and only fell back to Render
      // once a probe had rejected. That's a race — anything the user did
      // before the probe settled hit a dead port and reported itself as
      // "can't reach the server", which is how a working API looked broken.
      //
      // Now the reliable target is the default and the local backend is the
      // opt-in: if something answers on :8000 we switch to it, and until then
      // nothing is in a broken state.
      window.PHD_API_BASE = RENDER_API;
      if (isLocal) {
        try {
          var proto = location.protocol === "https:" ? "https:" : "http:";
          var localApi = proto + "//" + (h || "localhost") + ":8000";
          // Any HTTP response — even 401 — means a backend is there.
          fetch(localApi + "/", { method: "GET" })
            .then(function () { window.PHD_API_BASE = localApi; })
            .catch(function () { /* stay on the deployed API */ });
        } catch (e) { /* stay on the deployed API */ }
      }
    })();
  </script>

    }
  </script>

  <!-- TipTap — rich text editing for Documents (ESM; attaches window.TipTap
       when loaded. Editor components fall back to a plain textarea until then). -->
  <script type="module">
    try {
      const [{ Editor }, { default: StarterKit }] = await Promise.all([
        import("https://esm.sh/@tiptap/core@2.11.5"),
        import("https://esm.sh/@tiptap/starter-kit@2.11.5")
      ]);
      window.TipTap = { Editor, StarterKit };
      window.dispatchEvent(new Event("tiptap-ready"));
    } catch (e) { console.warn("TipTap failed to load; falling back to plain editor.", e); }
  </script>
